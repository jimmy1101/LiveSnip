name: Build Linux & Kylin OS Package

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install System Dependencies for Qt6 & Debian Packaging
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          dpkg-dev \
          libgl1-mesa-glx \
          libegl1 \
          libxkbcommon-x11-0 \
          libdbus-1-3 \
          libxcb-cursor0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-shape0 \
          libxcb-xinerama0 \
          libxcb-xfixes0 \
          libx11-xcb1

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Standalone Linux Executable with PyInstaller
      run: |
        pyinstaller --name=LiveSnip \
          --windowed \
          --noconfirm \
          --clean \
          --add-data "core:core" \
          --add-data "ui:ui" \
          --icon app.png \
          main.py

    - name: Build Kylin / Debian .deb Package
      run: |
        chmod +x build_deb.sh run_kylin.sh install_kylin.sh
        VERSION_TAG="${{ github.ref_name }}"
        if [[ ! "${VERSION_TAG#v}" =~ ^[0-9] ]]; then
          VERSION_TAG="v1.1.1"
        fi
        ./build_deb.sh "$VERSION_TAG"

    - name: Create Portable Linux Tarball
      run: |
        cp run_kylin.sh dist/LiveSnip/
        cp install_kylin.sh dist/LiveSnip/
        cp livesnip.desktop dist/LiveSnip/
        cp app.png dist/LiveSnip/
        VERSION_TAG="${{ github.ref_name }}"
        if [[ ! "${VERSION_TAG#v}" =~ ^[0-9] ]]; then
          VERSION_TAG="v1.1.1"
        fi
        ARCH=$(dpkg --print-architecture 2>/dev/null || echo "amd64")
        tar -czvf "LiveSnip_${VERSION_TAG}_Linux_${ARCH}.tar.gz" -C dist LiveSnip

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LiveSnip-Linux-Kylin-Packages
        path: |
          *.deb
          LiveSnip_*.tar.gz

    - name: Publish to GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          *.deb
          LiveSnip_*.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
